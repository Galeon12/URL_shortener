version: '3.9'

services:
  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: url-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ── MongoDB ───────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: url-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: url_shortener
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API instance 1 ────────────────────────────────────────────────────────────
  api1:
    build:
      context: ./url_shortener_service
      dockerfile: Dockerfile
    container_name: url-api-1
    restart: unless-stopped
    environment:
      PORT: 5000
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongo:27017/url_shortener
      RATE_LIMIT_CAPACITY: 10
      RATE_LIMIT_REFILL_RATE: 1
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    expose:
      - '5000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3

  # ── API instance 2 ────────────────────────────────────────────────────────────
  api2:
    build:
      context: ./url_shortener_service
      dockerfile: Dockerfile
    container_name: url-api-2
    restart: unless-stopped
    environment:
      PORT: 5000
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongo:27017/url_shortener
      RATE_LIMIT_CAPACITY: 10
      RATE_LIMIT_REFILL_RATE: 1
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    expose:
      - '5000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Nginx load balancer ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: url-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2

volumes:
  redis_data:
  mongo_data:
